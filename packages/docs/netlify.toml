# Netlify config for the Manti UI site (manti.design).
#
# ONE Netlify site serves everything from this repo:
#   - docs at the root (/)      -> manti.design
#   - Ladle at /ladle           -> manti.design/ladle
#
# The site's "Base directory" is `packages/docs`, so Netlify reads this file.
# `pnpm install` here installs the whole pnpm workspace (pnpm walks up to the
# root pnpm-workspace.yaml). The root `build:site` script then builds the
# libraries, the docs site (-> packages/docs/dist), and the Ladle gallery
# (-> ladle-static, built with base /ladle/), and copies Ladle into
# packages/docs/dist/ladle so both ship in a single deploy.
[build]
  command = "pnpm -w run build:site"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Deploy previews (one per pull request) are what fabrika's rendered review opens. It asks for
# surfaces in its own namespace from `.fabrika.jsonc` (`/ladle/react/…`, `/ladle/styles/…`,
# `/docs/…`), so a preview also writes a `_redirects` file that maps those paths onto the real
# ones. Ladle reads only its query string, so its two prefixes are rewritten in place (200). The
# docs site routes on the browser path, so `/docs/…` must be a real redirect (302) or its router
# renders its 404 page. Netlify reads `_redirects` before the rules below, and production never
# gets it.
[context.deploy-preview]
  command = "pnpm -w run build:site && printf '%s\\n' '/ladle/react/*  /ladle/:splat  200' '/ladle/styles/*  /ladle/:splat  200' '/docs/*  /:splat  302' > dist/_redirects"

# Canonical host: collapse www onto the apex so the two never serve duplicate
# content. Domain-level rules run before path rules.
[[redirects]]
  from = "https://www.manti.design/*"
  to = "https://manti.design/:splat"
  status = 301
  force = true

# The component gallery moved to /ladle. Every URL under its old path (the
# `from` below) answers 301 to the gallery root: the old `?path=/story/…` ids do
# not map onto Ladle's story ids, so a deep link lands on /ladle/ instead of a
# 404. The first rule matches those `?path=` links and drops the query (a plain
# rule passes it through); the second catches everything else, the bare old
# path included. `force` keeps them in charge even if a stale build of the old
# gallery is ever deployed. Both must stay above the /* 404 catch-all below.
[[redirects]]
  from = "/storybook/*"
  to = "/ladle/"
  status = 301
  force = true
  query = {path = ":path"}

[[redirects]]
  from = "/storybook/*"
  to = "/ladle/"
  status = 301
  force = true

# Last-resort fallback only. Every real route is prerendered to its own
# dist/<slug>/index.html (see packages/docs/scripts/prerender.mjs) and Netlify
# serves existing static files before applying redirects — so this catch-all is
# reached only by URLs that match no page, and everything under /ladle (real
# files) is unaffected by it.
#
# It answers 404, not 200. A 200 SPA fallback makes every mistyped or invented
# URL look like a real page to a crawler, which lets search engines and AI
# agents index unlimited duplicate, content-less URLs. There is no SPA to
# fall back to here, since each route is a real prerendered document.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Security headers for every response (docs + Ladle).
#
# The CSP is deliberately pragmatic for a fully static site:
#   - 'unsafe-inline' script-src: the no-flash theme init in index.html is an
#     inline script.
#   - 'unsafe-eval': Ladle rebuilds `storyOrder` from .ladle/config.mjs with
#     `new Function`; without it the gallery renders blank.
#   - style-src 'unsafe-inline': React inline styles + Shiki token colors.
#   - img-src allows https://avatars.githubusercontent.com (Avatar demo and
#     landing team portraits) and data:/blob: (QrCode data URIs, SignaturePad
#     exports, FileUpload previews).
# Everything else is same-origin. If a demo gains a new external resource, add
# its origin here or the browser will silently block it.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://avatars.githubusercontent.com; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
